# Configuration for Crash Bandicoot 2: Cortex Strikes Back (USA, SCUS-94154)
# for psxrecomp. Full schema: psxrecomp/docs/config_schema.md.
#
# [game] values come from the SCUS_941.54 PS-X EXE header and [prepare_disc]
# values from the Redump table (docs/ROADMAP.md). They match the output of
# psxrecomp/tools/new_project_layout/probe_disc.py on the disc.

[game]
name = "Crash Bandicoot 2: Cortex Strikes Back"
id = "SCUS-94154"
players = 1
# psxrecomp_cli.py generate extracts the executable here from the disc.
# Never under disc/: it is a symlink to ../privado/disc, which is read-only.
exe = "prepared_disc/SCUS_941.54"
disc = "disc/Crash Bandicoot 2 - Cortex Strikes Back (USA).cue"
load_address = "0x80010000"
entry_pc = "0x80049B2C"
text_size = "0x0004F800"
stack_base = "0x801FFFF0"

# Disc identity (single data track, no CDDA). generate and verify-disc reject
# any mismatched image.
[prepare_disc]
out_dir = "prepared_disc"
bin_name = "Crash Bandicoot 2 - Cortex Strikes Back (USA).bin"
cue_name = "Crash Bandicoot 2 - Cortex Strikes Back (USA).cue"
boot_exe = "SCUS_941.54"
known_sizes = [192814608]
known_md5 = ["3c31b5e038f025098a2fdfa70c8213f2"]
known_sha1 = ["3d37fe4288a83b01f1a0edbf78e76e0fede6bc22"]
known_crc32 = ["395c0916"]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "crash2-native"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[widescreen]
# Crash 2 geometry lives within the 4:3 frustum; use GTE X-squash (ws_mode = 1)
# on top of the cropped 512x216 (40:27) base rather than native-wide columns.
native_wide = false
# Classify active 3D GTE frames (gameplay, Warp Room, Pause) so OpenBIOS and
# 24-bit MDEC FMVs remain unstretched at 4:3.
gte_game_mode = true
