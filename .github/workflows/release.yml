name: Release AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          AppImage version (e.g. 0.1.0 or v0.1.0). Leave empty to use
          0.0.0-<commit> for a dry run without publishing a release.
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  build-appimage:
    name: Build AppImage (ubuntu:22.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Install minimal container requirements (ubuntu:22.04)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils unzip git python3 \
            binutils file desktop-file-utils gcc libc6-dev \
            libgl-dev libx11-dev libxext-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory '*'

      - name: Checkout with submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Resolve version from git tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            RAW="${{ github.ref_name }}"
            TAG="${RAW}"
            VER="${RAW#v}"
          else
            RAW="$(printf '%s' "${{ github.event.inputs.version }}" | tr -d '[:space:]')"
            if [[ -n "${RAW}" ]]; then
              VER="${RAW#v}"
              TAG="v${VER}"
            else
              SHORT_SHA="$(git rev-parse --short HEAD)"
              VER="0.0.0-${SHORT_SHA}"
              TAG="${VER}"
            fi
          fi
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?$ ]]; then
            echo "::error::invalid version '${VER}' (expected X.Y.Z or vX.Y.Z)"
            exit 1
          fi
          echo "version=${VER}" >>"${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >>"${GITHUB_OUTPUT}"
          echo "Resolved version: ${VER} (tag: ${TAG})"

      - name: Cache SHA-256 pinned build tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/appimage-tools
          key: appimage-tools-zig0.17.1-cmake3.31.6-ninja1.12.1-tomli2.2.1-appimagetool1.9.1-type2-20251108

      - name: Build AppImage
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bash packaging/appimage/build-appimage.sh \
            --version "${VER}" \
            --output "dist/crash2-native-${VER}-x86_64.AppImage" \
            --tool-cache ".cache/appimage-tools" \
            --jobs "$(nproc)"

      - name: Discless .AppImage smoke tests
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          APP="dist/crash2-native-${VER}-x86_64.AppImage"
          test -x "${APP}"

          "${APP}" --appimage-extract-and-run --help >/dev/null
          "${APP}" --appimage-extract-and-run --version | grep -qxF "crash2-native ${VER}"
          "${APP}" --appimage-extract-and-run --check-prereqs
          "${APP}" --appimage-extract-and-run --verify-disc --help >/dev/null

          TMPD="$(mktemp -d)"
          trap 'rm -rf "${TMPD}"' EXIT
          python3 -B - "${TMPD}" <<'PY'
          import hashlib, pathlib, sys, zlib
          d = pathlib.Path(sys.argv[1])
          payload = b"CRASH2_SYNTHETIC_SECTOR_" * 98
          (d / "s.bin").write_bytes(payload)
          (d / "s.cue").write_text(
              'FILE "s.bin" BINARY\n  TRACK 01 MODE2/2352\n    INDEX 01 00:00:00\n',
              encoding="utf-8",
          )
          crc = f"{zlib.crc32(payload) & 0xffffffff:08x}"
          md5 = hashlib.md5(payload).hexdigest()
          sha1 = hashlib.sha1(payload).hexdigest()
          (d / "ok.toml").write_text(
              f'[game]\nid = "SCUS-94154"\ndisc = "s.cue"\n\n'
              f'[prepare_disc]\nknown_sizes = [{len(payload)}]\n'
              f'known_md5 = ["{md5}"]\nknown_sha1 = ["{sha1}"]\nknown_crc32 = ["{crc}"]\n',
              encoding="utf-8",
          )
          (d / "bad.toml").write_text(
              f'[game]\ndisc = "s.cue"\n\n[prepare_disc]\n'
              f'known_sizes = [{len(payload)}]\nknown_crc32 = ["00000000"]\n',
              encoding="utf-8",
          )
          PY

          "${APP}" --appimage-extract-and-run --verify-disc --config "${TMPD}/ok.toml" --json >/dev/null
          rc=0; "${APP}" --appimage-extract-and-run --verify-disc --config "${TMPD}/bad.toml" >/dev/null || rc=$?
          test "${rc}" -eq 3

          # Verify real AppImage runtime launch (type2-runtime exports $APPIMAGE):
          # AppRun must preserve APPIMAGE in CRASH2NATIVE_APPIMAGE_PATH / RECOMP_APPIMAGE_PATH
          # and unset APPIMAGE so psxrecomp resolves bios/ and game.toml from DATA_DIR.
          REAL_DATA="${TMPD}/real-run"
          rc=0
          APP_LOG="$(CRASH2NATIVE_DATA_DIR="${REAL_DATA}" "${APP}" --appimage-extract-and-run --no-launcher --help 2>&1)" || rc=$?
          printf '%s\n' "${APP_LOG}"
          test "${rc}" -ne 0
          if printf '%s\n' "${APP_LOG}" | grep -qF "Bundled BIOS Missing"; then
            echo "error: .AppImage aborted with Bundled BIOS Missing (APPIMAGE leaked into runtime)" >&2
            exit 1
          fi
          if ! printf '%s\n' "${APP_LOG}" | grep -qF "psxrecomp: loaded game config ${REAL_DATA}/game.toml"; then
            echo "error: .AppImage did not load game.toml from temporary CRASH2NATIVE_DATA_DIR (${REAL_DATA})" >&2
            exit 1
          fi
          test -f "${REAL_DATA}/bios/openbios.bin"
          test -f "${REAL_DATA}/build-release/overlay_toolchain/python/bin/python3"

          # Verify extracted read-only AppImage + overlay_toolchain with tomli
          (cd "${TMPD}" && "${GITHUB_WORKSPACE}/${APP}" --appimage-extract >/dev/null)
          SQ="${TMPD}/squashfs-root"
          test ! -e "${SQ}/usr/lib"
          if find "${SQ}" \( -iname 'libGL*' -o -iname 'libOpenGL*' -o -iname 'libGLX*' -o -iname 'libGLdispatch*' -o -iname 'libEGL*' -o -iname 'libdrm*' \) | grep -q .; then
            echo "error: AppImage bundles forbidden graphics libraries" >&2
            exit 1
          fi
          SQ_PAY="${SQ}/usr/share/crash2-native"
          if find "${SQ}" \
            \( -name 'prepared_disc' -o -name 'ghidra' -o -name 'SCUS_*' -o -iname 'SCPH*.BIN' -o -iname '*.cue' -o -iname '*.chd' -o -iname '*.iso' \
               -o \( -name 'generated' -not -path "${SQ_PAY}/psxrecomp/generated" -not -path "${SQ_PAY}/psxrecomp/recompiler/lib/rabbitizer/include/generated" -not -path "${SQ_PAY}/psxrecomp/recompiler/lib/rabbitizer/cplusplus/include/generated" \) \
               -o \( -name 'disc' -not -path "${SQ_PAY}/psxrecomp/tools/cycle_testrom/disc" \) \) | grep -q .; then
            echo "error: AppImage bundles game artifacts" >&2
            exit 1
          fi
          chmod -R a-w "${SQ}"
          rc=0
          CRASH2NATIVE_DATA_DIR="${TMPD}/user-data" APPDIR="${SQ}" "${SQ}/AppRun" --no-launcher --help || rc=$?
          test "${rc}" -ne 0
          "${TMPD}/user-data/build-release/overlay_toolchain/python/bin/python3" -c "import tomli"

          UD_PROJ="${TMPD}/user-data/project"
          test -d "${UD_PROJ}/psxrecomp/bios" && test ! -L "${UD_PROJ}/psxrecomp/bios"
          test -d "${UD_PROJ}/psxrecomp/generated" && test ! -L "${UD_PROJ}/psxrecomp/generated"
          test -d "${UD_PROJ}/psxrecomp/runtime/include" && test ! -L "${UD_PROJ}/psxrecomp/runtime/include"
          test -L "${UD_PROJ}/psxrecomp/generated/OpenBIOS_dispatch.c"

          # Verify psxrecomp_cli.py ensure-emitters + generate against read-only AppDir
          # using a synthetic PS-X EXE and AppRun's staged env (never creates recompiler/build).
          python3 -B - "${TMPD}" "${UD_PROJ}" <<'PY'
          import pathlib, struct, zlib, sys
          tmpd = pathlib.Path(sys.argv[1])
          proj = pathlib.Path(sys.argv[2])
          exe = bytearray(4096)
          exe[0:8] = b"PS-X EXE"
          struct.pack_into("<III", exe, 0x10, 0x80010000, 0, 0x80010000)
          struct.pack_into("<I", exe, 0x1C, 2048)
          struct.pack_into("<II", exe, 0x800, 0x03E00008, 0x00000000)
          (proj / "prepared_disc" / "TEST_000.01").write_bytes(exe)
          payload = b"SYNTH_PSX_SECTOR_" * 128
          (tmpd / "synth_gen.bin").write_bytes(payload)
          (proj / "synth_seeds.txt").write_text("", encoding="utf-8")
          (proj / "synth_gen.toml").write_text(
              '[game]\n'
              'name = "SynthTest"\n'
              'id = "TEST-00001"\n'
              'exe = "prepared_disc/TEST_000.01"\n'
              'disc = "synth_gen.bin"\n'
              'load_address = "0x80010000"\n'
              'entry_pc = "0x80010000"\n'
              'text_size = "0x00000800"\n'
              'stack_base = "0x801FFFF0"\n\n'
              '[prepare_disc]\n'
              'out_dir = "prepared_disc"\n'
              'boot_exe = "TEST_000.01"\n'
              f'known_sizes = [{len(payload)}]\n'
              f'known_crc32 = ["{zlib.crc32(payload) & 0xffffffff:08x}"]\n\n'
              '[recompiler]\n'
              'seeds = "synth_seeds.txt"\n'
              'out_dir = "generated-synth"\n',
              encoding="utf-8",
          )
          PY
          env -C "${TMPD}" \
            PATH="${TMPD}/user-data/toolchain/bin:${PATH}" \
            PSXRECOMP_GAME="${TMPD}/user-data/toolchain/bin/psxrecomp-game" \
            PSXRECOMP_BIOS="${TMPD}/user-data/toolchain/bin/psxrecomp-bios" \
            python3 -B "${UD_PROJ}/psxrecomp/psxrecomp_cli.py" ensure-emitters \
              --project-root "${UD_PROJ}" \
              --no-download
          env -C "${TMPD}" \
            PATH="${TMPD}/user-data/toolchain/bin:${PATH}" \
            PSXRECOMP_GAME="${TMPD}/user-data/toolchain/bin/psxrecomp-game" \
            PSXRECOMP_BIOS="${TMPD}/user-data/toolchain/bin/psxrecomp-bios" \
            python3 -B "${UD_PROJ}/psxrecomp/psxrecomp_cli.py" generate \
              --config "${UD_PROJ}/synth_gen.toml" \
              --project-root "${UD_PROJ}" \
              --disc "${TMPD}/synth_gen.bin" \
              --no-toolchain-download
          test -f "${UD_PROJ}/generated-synth/TEST_000.01_dispatch.c"
          test ! -e "${SQ_PAY}/psxrecomp/recompiler/build"
          test ! -e "${UD_PROJ}/psxrecomp/recompiler/build"
          chmod -R u+w "${SQ}"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          (
            cd dist
            sha256sum "crash2-native-${VER}-x86_64.AppImage" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash2-native-appimage
          path: |
            dist/crash2-native-*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-appimage
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crash2-native-appimage
          path: dist

      - name: Verify SHA256SUMS before publishing
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create GitHub Release with AppImage and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "crash2-native ${{ github.ref_name }}" \
            --generate-notes \
            dist/crash2-native-*.AppImage \
            dist/SHA256SUMS
